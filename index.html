<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Comfy Quote Builder</title>
<style>
:root{--blue:#1B4193;--deep:#102C6B;--red:#D42027;--line:#CEDDF0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef6ff,#e6eef8);color:#152238}#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.card{width:min(430px,94vw);background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 18px 55px rgba(16,44,107,.18);overflow:hidden;text-align:center}.bar{height:8px;background:linear-gradient(90deg,var(--blue) 0 72%,var(--red) 72%)}.inside{padding:34px 30px 30px}h1{margin:0;color:var(--blue);font-size:30px}.sub{margin:8px 0 25px;color:#65738b;font-size:16px}#pin{width:100%;font-size:34px;letter-spacing:14px;text-align:center;padding:14px 10px;border:2px solid var(--line);border-radius:14px;outline:none;color:var(--deep);font-weight:700;background:#fafdff}#pin:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(27,65,147,.10)}#unlock{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:20px;font-weight:700;cursor:pointer}#msg{height:22px;margin-top:12px;color:var(--red);font-size:15px;font-weight:700}.small{margin-top:9px;font-size:12px;color:#8a96a8}#app{display:none;border:0;width:100%;height:100vh;height:100dvh;background:#fff}
</style>
</head>
<body>
<div id="gate"><div class="card"><div class="bar"></div><div class="inside"><h1>Comfy Quote Builder</h1><div class="sub">Enter your 4-digit access code</div><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4 digit access code"><button id="unlock" type="button">Unlock Quote Builder</button><div id="msg" role="alert"></div><div class="small">Authorized Comfy Heating &amp; Air users only</div></div></div></div>
<iframe id="app" src="about:blank" title="Comfy Quote Builder"></iframe>
<script>
(function(){const ACCESS_CODE='1946',STORAGE_KEY='comfy_quote_builder_access',gate=document.getElementById('gate'),pin=document.getElementById('pin'),msg=document.getElementById('msg'),app=document.getElementById('app');function openBuilder(){gate.style.display='none';app.style.display='block';if(app.getAttribute('src')!=='Comfy_Quote_Builder.html')app.setAttribute('src','Comfy_Quote_Builder.html')}function unlock(){if(pin.value===ACCESS_CODE){try{localStorage.setItem(STORAGE_KEY,'yes')}catch(e){}msg.textContent='';openBuilder()}else{msg.textContent='Incorrect passcode';pin.value='';pin.focus()}}try{if(localStorage.getItem(STORAGE_KEY)==='yes'){openBuilder();return}}catch(e){}document.getElementById('unlock').addEventListener('click',unlock);pin.addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});pin.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,4);msg.textContent=''});setTimeout(function(){pin.focus()},100)})();
</script>
</body>
</html>
