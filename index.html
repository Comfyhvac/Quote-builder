<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comfy Quote Builder</title><style>html,body{margin:0;height:100%;font-family:Arial;background:#eef6ff}#gate{height:100%;display:flex;align-items:center;justify-content:center}.card{background:white;padding:36px;border-radius:20px;text-align:center;box-shadow:0 12px 40px #0002;width:min(390px,85vw)}h1{color:#1B4193}input{font-size:32px;width:180px;text-align:center;letter-spacing:12px;padding:10px}button{display:block;margin:16px auto;padding:14px 25px;background:#1B4193;color:white;border:0;border-radius:10px;font-size:18px}#msg{color:#D42027;height:20px}iframe{display:none;border:0;width:100%;height:100%}</style></head><body><div id="gate"><div class="card"><h1>Comfy Quote Builder</h1><p>Enter your 4-digit access code</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button id="unlock">Unlock Quote Builder</button><div id="msg"></div><small>Authorized Comfy Heating & Air users only</small></div></div><iframe id="app"></iframe><script>const p='1946',g=document.getElementById('gate'),i=document.getElementById('pin'),a=document.getElementById('app'),m=document.getElementById('msg');function openApp(){g.style.display='none';a.style.display='block';a.src='Quote_Builder_App.html'}function unlock(){if(i.value===p){m.textContent='';openApp()}else{m.textContent='Incorrect passcode';i.value='';i.focus()}}document.getElementById('unlock').onclick=unlock;i.onkeydown=e=>{if(e.key==='Enter')unlock()};i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(0,4);m.textContent=''};setTimeout(()=>i.focus(),100);</script></body></html>
